<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FogFarm login</title>
    <link rel="stylesheet" href="styles.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allison&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">


    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

</head>
<body>
    <div class="navbar">
        <ul>
            <li><a href="index.html"><div class="logo"><img src="FogFarm.png"></div></a></li>
            <li class="nav-right-group">
                <a href="login.html">Farms</a>
                <a href="login.html">Log in</a>
            </li>
        </ul>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <h1>Log in</h1>

            <label for="username">Username</label>
            <input type="text" id="username" name="username">

            <label for="password">Password</label>
            <input type="password" id="password" name="password">

            <button type="submit" class="login-btn">Log in</button>
        </div>
    </div>   

    <script>
        document.querySelector('.login-btn').addEventListener('click', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (username === 'pirateking' && password === '9011') {
                window.location.href = 'Farm.html'; // change to your actual page
            } else {
                alert('Incorrect username or password');
            }
        });
    </script>

</body>
</html>
